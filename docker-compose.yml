x-streamlit-common: &streamlit-common
  image: python:3.11-slim
  working_dir: /app
  command: >-
    bash -lc "pip install --no-cache-dir -r requirements.txt &&
    alembic upgrade head &&
    streamlit run app.py --server.address 0.0.0.0 --server.port 8501"
  volumes:
    - ./:/app
  networks:
    - regtech-net
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
    interval: 20s
    timeout: 10s
    retries: 10
    start_period: 60s

services:
  postgres:
    image: postgres:16-alpine
    container_name: regtech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: regtech
      POSTGRES_USER: regtech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regtech-local}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regtech -d regtech"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - regtech-net

  migrate:
    build:
      context: .
      dockerfile: services/migration/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://regtech:${POSTGRES_PASSWORD:-regtech-local}@postgres:5432/regtech
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]
    networks:
      - regtech-net

  etcd:
    container_name: regtech-etcd
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - regtech-net

  minio:
    container_name: regtech-minio
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - regtech-net

  milvus:
    container_name: regtech-milvus
    image: milvusdb/milvus:v2.5.11
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      COMMON_STORAGETYPE: local
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "127.0.0.1:19530:19530"
      - "127.0.0.1:9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 90s
    networks:
      - regtech-net

  attu:
    container_name: regtech-attu
    image: zilliz/attu:v2.5.12
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "127.0.0.1:8000:3000"
    profiles: ["tools"]
    depends_on:
      milvus:
        condition: service_healthy
    networks:
      - regtech-net

  streamlit-api:
    <<: *streamlit-common
    ports:
      - "${API_CPU_STREAMLIT_PORT:-8501}:8501"
    environment:
      DEPLOYMENT_MODE: api-cpu
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      STREAMLIT_PORT: "8501"
      DATABASE_URL: postgresql+psycopg://regtech:${POSTGRES_PASSWORD:-regtech-local}@postgres:5432/regtech
      LLM_PROVIDER: openai
      PLANNER_LLM_MODEL: ${PLANNER_LLM_MODEL:-deepseek-chat}
      PLANNER_LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      PLANNER_LLM_API_KEY: ${LLM_API_KEY:-}
      DRAFT_LLM_MODEL: ${DRAFT_LLM_MODEL:-deepseek-chat}
      DRAFT_LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      DRAFT_LLM_API_KEY: ${LLM_API_KEY:-}
      AUDITOR_LLM_MODEL: ${AUDITOR_LLM_MODEL:-deepseek-chat}
      AUDITOR_LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      AUDITOR_LLM_API_KEY: ${LLM_API_KEY:-}
      JUDGE_LLM_MODEL: ${JUDGE_LLM_MODEL:-deepseek-chat}
      JUDGE_LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      JUDGE_LLM_API_KEY: ${LLM_API_KEY:-}
      EMBEDDING_SERVICE_URL: http://embedding-cpu:8000
      NLI_SERVICE_URL: http://nli-cpu:8000
      NLI_ENABLED: "true"
      RERANKER_ENABLED: "false"
      PREFER_LOCAL_INFERENCE_FALLBACK: "false"
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      embedding-cpu:
        condition: service_healthy
      nli-cpu:
        condition: service_healthy
    profiles: ["api-cpu"]

  streamlit-gpu:
    <<: *streamlit-common
    ports:
      - "${GPU_STREAMLIT_PORT:-8502}:8501"
    environment:
      DEPLOYMENT_MODE: gpu-self-hosted
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      STREAMLIT_PORT: "8501"
      DATABASE_URL: postgresql+psycopg://regtech:${POSTGRES_PASSWORD:-regtech-local}@postgres:5432/regtech
      LLM_PROVIDER: vllm
      PLANNER_LLM_MODEL: Qwen/Qwen2.5-7B-Instruct
      PLANNER_LLM_BASE_URL: http://planner-llm:8000/v1
      DRAFT_LLM_MODEL: Qwen/Qwen2.5-72B-Instruct-AWQ
      DRAFT_LLM_BASE_URL: http://generation-llm:8000/v1
      AUDITOR_LLM_MODEL: Qwen/Qwen2.5-72B-Instruct-AWQ
      AUDITOR_LLM_BASE_URL: http://generation-llm:8000/v1
      JUDGE_LLM_MODEL: Qwen/Qwen2.5-72B-Instruct-AWQ
      JUDGE_LLM_BASE_URL: http://generation-llm:8000/v1
      EMBEDDING_SERVICE_URL: http://embedding:8000
      RERANKER_SERVICE_URL: http://reranker:8000
      NLI_SERVICE_URL: http://nli:8000
      NLI_ENABLED: "true"
      RERANKER_ENABLED: "true"
      PREFER_LOCAL_INFERENCE_FALLBACK: "false"
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
      planner-llm:
        condition: service_healthy
      generation-llm:
        condition: service_healthy
      embedding:
        condition: service_healthy
      reranker:
        condition: service_healthy
      nli:
        condition: service_healthy
    profiles: ["gpu-self-hosted"]

  planner-llm:
    image: vllm/vllm-openai:v0.8.5
    command: >-
      --model Qwen/Qwen2.5-7B-Instruct
      --served-model-name Qwen/Qwen2.5-7B-Instruct
      --enable-prefix-caching
      --max-model-len 8192
    volumes:
      - hf-cache:/root/.cache/huggingface
    profiles: ["gpu-self-hosted"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 300s
    networks:
      - regtech-net

  generation-llm:
    image: vllm/vllm-openai:v0.8.5
    command: >-
      --model Qwen/Qwen2.5-72B-Instruct-AWQ
      --served-model-name Qwen/Qwen2.5-72B-Instruct-AWQ
      --quantization awq
      --tensor-parallel-size 2
      --enable-prefix-caching
      --max-model-len 16384
    volumes:
      - hf-cache:/root/.cache/huggingface
    profiles: ["gpu-self-hosted"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 300s
    networks:
      - regtech-net

  embedding:
    build:
      context: .
      dockerfile: services/inference_api/Dockerfile
    environment:
      SERVICE_MODE: embedding
      MODEL_NAME: BAAI/bge-m3
    volumes:
      - hf-cache:/root/.cache/huggingface
    profiles: ["gpu-self-hosted"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 180s
    networks:
      - regtech-net

  reranker:
    build:
      context: .
      dockerfile: services/inference_api/Dockerfile
    environment:
      SERVICE_MODE: reranker
      MODEL_NAME: BAAI/bge-reranker-large
    volumes:
      - hf-cache:/root/.cache/huggingface
    profiles: ["gpu-self-hosted"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 180s
    networks:
      - regtech-net

  nli:
    build:
      context: .
      dockerfile: services/inference_api/Dockerfile
    environment:
      SERVICE_MODE: nli
      MODEL_NAME: MoritzLaurer/mDeBERTa-v3-base-mnli-xnli
    volumes:
      - hf-cache:/root/.cache/huggingface
    profiles: ["gpu-self-hosted"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 180s
    networks:
      - regtech-net

  embedding-cpu:
    build:
      context: .
      dockerfile: services/inference_api/Dockerfile.cpu
    restart: unless-stopped
    environment:
      SERVICE_MODE: embedding
      MODEL_NAME: BAAI/bge-m3
      USE_FP16: "false"
      DEVICE: "-1"
    ports:
      - "127.0.0.1:8101:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    profiles: ["api-cpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks:
      - regtech-net

  nli-cpu:
    build:
      context: .
      dockerfile: services/inference_api/Dockerfile.cpu
    restart: unless-stopped
    environment:
      SERVICE_MODE: nli
      MODEL_NAME: MoritzLaurer/mDeBERTa-v3-base-mnli-xnli
      USE_FP16: "false"
      DEVICE: "-1"
    ports:
      - "127.0.0.1:8103:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    profiles: ["api-cpu"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks:
      - regtech-net

  reranker-cpu:
    build:
      context: .
      dockerfile: services/inference_api/Dockerfile.cpu
    restart: unless-stopped
    environment:
      SERVICE_MODE: reranker
      MODEL_NAME: BAAI/bge-reranker-large
      USE_FP16: "false"
      DEVICE: "-1"
    ports:
      - "127.0.0.1:8102:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    profiles: ["tools"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
    networks:
      - regtech-net

volumes:
  postgres-data:
  hf-cache:
  etcd-data:
  minio-data:
  milvus-data:

networks:
  regtech-net:
    driver: bridge
