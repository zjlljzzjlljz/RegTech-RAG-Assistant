services:
  etcd:
    container_name: regtech-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - regtech-net

  minio:
    container_name: regtech-minio
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - regtech-net

  milvus:
    container_name: regtech-milvus
    image: milvusdb/milvus:v2.5.11
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      COMMON_STORAGETYPE: local
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 90s
    networks:
      - regtech-net

  attu:
    container_name: regtech-attu
    image: zilliz/attu:v2.5.12
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8000:3000"
    depends_on:
      milvus:
        condition: service_started
    networks:
      - regtech-net

  streamlit:
    container_name: regtech-streamlit
    image: python:3.11-slim
    working_dir: /app
    command: >-
      bash -lc "pip install --no-cache-dir -r requirements.txt &&
      streamlit run app.py --server.address 0.0.0.0 --server.port 8501"
    environment:
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      STREAMLIT_PORT: "8501"
    ports:
      - "8501:8501"
    volumes:
      - ./:/app
    depends_on:
      milvus:
        condition: service_started
    profiles:
      - app
    networks:
      - regtech-net

volumes:
  etcd-data:
  minio-data:
  milvus-data:

networks:
  regtech-net:
    driver: bridge
